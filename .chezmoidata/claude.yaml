claude:
  # Plugin marketplaces, grouped by machine. Put each marketplace in exactly
  # ONE of: shared, work, personal (no overlapping names across sections).
  # The top key is the marketplace NAME (the @suffix in a plugin reference,
  # e.g. pdk@ai-dev-toolkit). `repo` is the GitHub source; `plugins` lists the
  # plugin names to enable from it.
  marketplaces:
    shared: {}
      # claude-plugins-official:
      #   repo: anthropics/claude-plugins-official
      #   plugins:
      #     - commit-commands
    work:
      ai-dev-toolkit:
        repo: covermymeds/ai-dev-toolkit
        plugins:
          - pdk
          - lava-platform-tools
    personal: {}
      # my-mp:
      #   repo: cwoodcox/my-plugins
      #   plugins:
      #     - foo
